spring.application.name=senti_mate_back_end

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/sentimate_db
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# Server Configuration
server.port=8080

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.senti_mate_back_end=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=10

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# JWT Configuration
jwt.secret=your_jwt_secret_key_should_be_at_least_32_characters_long
jwt.expiration=86400000

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN

# Samsung Health SDK Web API Configuration
samsung.health.client-id=your_samsung_health_client_id
samsung.health.client-secret=your_samsung_health_client_secret
samsung.health.redirect-uri=http://localhost:8080/api/health-data/samsung/callback
samsung.health.authorization-uri=https://api.health.samsung.com/oauth2/authorize
samsung.health.token-uri=https://api.health.samsung.com/oauth2/token
samsung.health.api-base-url=https://api.health.samsung.com/v1

# OpenAI ChatGPT API Configuration
openai.api-key=your_openai_api_key
openai.model=gpt-4
openai.max-tokens=1000
openai.temperature=0.7
