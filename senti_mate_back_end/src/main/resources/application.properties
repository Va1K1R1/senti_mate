spring.application.name=senti_mate_back_end

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/sentimate_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# Server Configuration
server.port=8080

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.senti_mate_back_end=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=10

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# JWT Configuration
jwt.secret=591951915951919511159191951951951915915915
jwt.expiration=86400000

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN

# OpenAI ChatGPT API Configuration
openai.api-key=${OPENAI_API_KEY:your-api-key-here}
openai.base-url=https://api.openai.com/v1
openai.model=gpt-3.5-turbo
openai.temperature=0.7
openai.max-tokens=1000
openai.connect-timeout=10000
openai.read-timeout=60000
openai.max-retries=3
openai.retry-delay=1000

# Async task execution settings
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=15
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=chatgpt-async-

# Retry configuration
spring.retry.enabled=true
# ? Samsung Health API Configuration (Mock Mode)
samsung.health.client-id=MOCK_CLIENT_ID
samsung.health.client-secret=MOCK_CLIENT_SECRET
samsung.health.redirect-uri=http://localhost:8080/auth/samsung-health/callback
samsung.health.authorization-uri=https://mock.samsunghealth.com/oauth2/authorize
samsung.health.token-uri=https://mock.samsunghealth.com/oauth2/token
samsung.health.api-base-url=https://mock.samsunghealth.com/api
samsung.health.scope=activity sleep heart_rate exercise
samsung.health.connect-timeout=10000
samsung.health.read-timeout=30000
samsung.health.max-retries=3
samsung.health.retry-delay=1000

# Mock ??? ??
samsung.health.mock.enabled=true
samsung.health.mock.data-days=7
samsung.health.mock.message=? ?? ?? ?? - Mock ??? ??

# Spring Boot Configuration
spring.main.allow-bean-definition-overriding=false